<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Onur Ergençiçeği</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>⚔️</text></svg>">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="wrap">

  <div class="topbar">
    <button class="lang-btn" id="btn-tr">🇹🇷 TR</button>
    <button class="lang-btn" id="btn-en">🇬🇧 EN</button>
  </div>

  <div class="tabs">
    <button class="tab-btn" data-tab="home"></button>
    <button class="tab-btn" data-tab="personal"></button>
    <button class="tab-btn" data-tab="work"></button>
    <button class="tab-btn" data-tab="projects"></button>
    <button class="tab-btn" data-tab="certificates"></button>
  </div>

  <!-- HOME -->
  <div class="tab-panel" id="panel-home">
    <div class="home-header">
      <div class="home-photo"><img src="assets/profile.jpg" alt="profile"></div>
      <div class="home-text">
        <h1 id="profile-name"></h1>
        <div class="tagline" id="profile-tagline"></div>
        <p id="profile-intro"></p>
        <div class="link-btn-row" id="profile-links"></div>
      </div>
    </div>
    <hr>
    <h2 id="lbl-currently-working"></h2>
    <div id="home-current-projects"></div>
    <hr>
    <h2 id="lbl-education"></h2>
    <div class="project-card">
      <b>Mersin University</b><span class="status-badge">2022 – 2026</span>
      <p>B.Sc. Information Systems and Technologies — Graduate &nbsp;·&nbsp; <span id="lbl-gpa"></span>: 75.63 / 100 &nbsp;(3.28 / 4.0)</p>
      <div style="display:flex; gap:0.6rem; flex-wrap:wrap; margin-top:0.4rem;">
        <button class="btn" id="btn-transcript-view" type="button" data-pdf="assets/documents/mersin_universitesi_transkript.pdf"></button>
        <a class="btn dl" id="btn-transcript-dl" href="assets/documents/mersin_universitesi_transkript.pdf" download></a>
      </div>
    </div>
    <div class="project-card"><b>Falez High School</b><span class="status-badge">2018 – 2022</span></div>
  </div>

  <!-- PERSONAL -->
  <div class="tab-panel" id="panel-personal">
    <div class="tabs subtabs">
      <button class="tab-btn" data-subtab="story"></button>
      <button class="tab-btn" data-subtab="thoughts"></button>
      <button class="tab-btn" data-subtab="hobbies"></button>
    </div>

    <div class="tab-panel" id="subpanel-story">
      <h1 id="lbl-my-story"></h1>
      <h2 id="lbl-story-short"></h2>
      <p id="story-short"></p>
      <hr>
      <h2 id="lbl-story-long"></h2>
      <p id="story-long"></p>
    </div>

    <div class="tab-panel" id="subpanel-thoughts">
      <h1 id="lbl-thoughts"></h1>
      <p id="lbl-thoughts-caption" style="color:var(--muted)"></p>
      <div id="journal-list"></div>
    </div>

    <div class="tab-panel" id="subpanel-hobbies">
      <h1 id="lbl-hobbies"></h1>
      <div class="hobbies-grid" id="hobbies-grid"></div>
      <hr>
      <div id="hobby-tags"></div>
    </div>
  </div>

  <!-- WORK -->
  <div class="tab-panel" id="panel-work">
    <h1 id="lbl-work"></h1>
    <div id="experience-list"></div>
    <hr>
    <h2 id="lbl-logbook"></h2>
    <p id="lbl-logbook-caption" style="color:var(--muted)"></p>
    <div id="logbook-presentation"></div>
    <div id="logbook-list"></div>
    <hr>
    <h2 id="lbl-tourism"></h2>
    <p id="lbl-tourism-caption" style="color:var(--muted)"></p>
    <div id="tourism-list"></div>
  </div>

  <!-- PROJECTS -->
  <div class="tab-panel" id="panel-projects">
    <h1 id="lbl-projects"></h1>
    <div class="tabs subtabs">
      <button class="tab-btn" data-subtab2="current"></button>
      <button class="tab-btn" data-subtab2="past"></button>
    </div>
    <div class="tab-panel" id="subpanel2-current">
      <div id="projects-current-list"></div>
    </div>
    <div class="tab-panel" id="subpanel2-past">
      <div id="projects-past-list"></div>
    </div>
  </div>

  <!-- CERTIFICATES -->
  <div class="tab-panel" id="panel-certificates">
    <h1 id="lbl-certificates"></h1>
    <p id="lbl-certificates-caption" style="color:var(--muted)"></p>
    <div id="certificates-list"></div>
  </div>

</div>

<!-- MODAL -->
<div class="modal-overlay" id="modal-overlay">
  <div class="modal-box" id="modal-box">
    <button class="modal-close" id="modal-close">✕</button>
    <div id="modal-content"></div>
  </div>
</div>

<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
